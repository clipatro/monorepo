# Docker Desktop-compatible local defaults.
# Application source is copied into each image so startup does not depend on
# Windows/macOS bind-mount behavior. Rebuild after source changes with:
#   docker compose up --build

services:
  api-gateway:
    init: true

  story-service:
    init: true

  research-service:
    init: true

  image-service:
    init: true

  voice-service:
    init: true

  embedding-service:
    init: true

  workflow-service:
    init: true

  video-service:
    init: true

  publish-service:
    init: true

  web-frontend:
    init: true
